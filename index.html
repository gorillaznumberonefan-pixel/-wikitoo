<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikitoo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <h1>Wikitoo</h1>

    <input type="text" id="search" placeholder="What do you want to know?">
    <button id="search-button" onclick="search()">Search</button>

    <!-- Browse Button -->
    <button id="browse-button" onclick="toggleBrowse()">📚 Browse</button>

    <!-- Browse Menu -->
    <div id="browse-menu" style="display: none;">
        Loading...
    </div>

    <!-- Bug Report Button -->
    <button id="bug-button" onclick="showBugReport()">🐛 Report a Bug</button>

    <!-- Language Button -->
    <button id="language-button" onclick="toggleLanguage()">🌐 Language</button>

    <!-- Language Menu -->
    <div id="language-menu" style="display: none;">
        <button onclick="selectLanguage('English')">🇺🇸 English</button>
        <button onclick="selectLanguage('Spanish')">🇪🇸 Spanish</button>
        <button onclick="selectLanguage('Chinese')">🇨🇳 Chinese (Mandarin)</button>
        <button onclick="selectLanguage('Hindi')">🇮🇳 Hindi</button>
        <button onclick="selectLanguage('Bengali')">🇧🇩 Bengali</button>
        <button onclick="selectLanguage('Portuguese')">🇵🇹 Portuguese</button>
        <button onclick="selectLanguage('Russian')">🇷🇺 Russian</button>
        <button onclick="selectLanguage('Japanese')">🇯🇵 Japanese</button>
        <button onclick="selectLanguage('German')">🇩🇪 German</button>
        <button onclick="selectLanguage('French')">🇫🇷 French</button>
        <button onclick="selectLanguage('Vietnamese')">🇻🇳 Vietnamese</button>
        <button onclick="selectLanguage('Turkish')">🇹🇷 Turkish</button>
        <button onclick="selectLanguage('Korean')">🇰🇷 Korean</button>
        <button onclick="selectLanguage('Italian')">🇮🇹 Italian</button>
        <button onclick="selectLanguage('Arabic')">🇸🇦 Arabic</button>
        <button onclick="selectLanguage('Dutch')">🇳🇱 Dutch</button>
        <button onclick="selectLanguage('Polish')">🇵🇱 Polish</button>
        <button onclick="selectLanguage('Ukrainian')">🇺🇦 Ukrainian</button>
        <button onclick="selectLanguage('Indonesian')">🇮🇩 Indonesian</button>
        <button onclick="selectLanguage('Greek')">🇬🇷 Greek</button>
    </div>

    <!-- Bug Report Form -->
    <div id="bug-report" style="display: none;">
        <h2>🐛 Report a Bug</h2>

        <label for="bug-page">What page were you on?</label>
        <input type="text" id="bug-page" placeholder="Example: Cello">

        <label for="bug-description">What went wrong?</label>
        <textarea id="bug-description" placeholder="Describe the bug..."></textarea>

        <label for="bug-expected">What did you expect to happen?</label>
        <textarea id="bug-expected" placeholder="Describe what you expected..."></textarea>

        <button onclick="submitBugReport()">Send Bug Report</button>
        <button onclick="hideBugReport()">Cancel</button>
    </div>

    <div id="content"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
